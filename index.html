<script>
  tailwind.config = {
    theme: {
      extend: {

          rose: 'var(--rose)', 'rose-soft': 'var(--rose-soft)', 'rose-deep': 'var(--rose-deep)',
          gold: 'var(--gold)', sage: 'var(--sage)', 'sage-soft': 'var(--sage-soft)', neon: 'var(--neon)', line: 'var(--line)', 'on-deep': 'var(--on-deep)'

<style>
  /* Layout: sticky glass header, asymmetric hero with arched photo, light sections separated by thin gold rules,
     one deep dusty-rose block for the training offer, map card in contacts. */
  :root {
    --bg: #F2F1F0;          /* light grey with a faint warm-pink bias */
    --surface: #FFFFFF;
    --ink: #3B3839;         /* dark grey text */
    --mute: #6F6A6B;
    --rose: #C9908F;        /* dusty pink of the couch */
    --rose-soft: #F1DEDC;
    --rose-deep: #6B4146;   /* training block ground */
    --on-deep: #F7ECEA;
    --gold: #B79A5B;
    --line: #DDD9D7;
    --sage: #8E937F;        /* ring of the Body_line logo */
    --sage-soft: #E6E7DF;
    --neon: #F08BB0;        /* neon sign in the salon */
    --header-bg: rgba(242, 241, 240, 0.82);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1B1C; --surface: #282425; --ink: #EEE8E6; --mute: #B0A7A7;
      --rose: #D6A09E; --rose-soft: #3A2C2E; --rose-deep: #4A2B30; --on-deep: #F7ECEA;
      --gold: #CDB176; --line: #3A3536; --header-bg: rgba(30, 27, 28, 0.82);
      --sage: #A4A993; --sage-soft: #2A2C26; --neon: #F08BB0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1B1C; --surface: #282425; --ink: #EEE8E6; --mute: #B0A7A7;
    --rose: #D6A09E; --rose-soft: #3A2C2E; --rose-deep: #4A2B30; --on-deep: #F7ECEA;
    --gold: #CDB176; --line: #3A3536; --header-bg: rgba(30, 27, 28, 0.82);
    --sage: #A4A993; --sage-soft: #2A2C26; --neon: #F08BB0;
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: 'Jost', system-ui, sans-serif; font-size: 16px; line-height: 1.65; }
  h1, h2, h3 { font-family: 'Forum', Georgia, serif; font-weight: 400; text-wrap: balance; letter-spacing: 0.005em; }
  section[id] { scroll-margin-top: 84px; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
  .gold-rule { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
  .header-glass { background: var(--header-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .85rem 1.6rem; font-size: .9rem; letter-spacing: .06em; font-weight: 500; border-radius: 999px; transition: background .25s, color .25s, border-color .25s, transform .25s; cursor: pointer; border: 1px solid transparent; text-align: center; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .btn-rose { background: var(--rose); color: #2E1E20; }
  .btn-rose:hover { background: var(--rose-soft); color: var(--rose-deep); }
  .btn-ghost { border-color: var(--gold); color: var(--ink); background: transparent; }
  .btn-ghost:hover { background: var(--surface); }
  .btn-gold { background: var(--gold); color: #2B2114; }
  .btn-gold:hover { background: var(--on-deep); }
  .neon-glow { box-shadow: 0 0 0 1px var(--gold), 0 0 28px -6px var(--neon); }
  .arch { border-radius: 999px 999px 18px 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); }
  .price-card { transition: transform .3s, box-shadow .3s; }
  .price-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -22px rgba(107, 65, 70, .45); }
  .chip { border: 1px solid var(--line); background: var(--surface); padding: .4rem .95rem; border-radius: 999px; font-size: .9rem; }
  .field { width: 100%; background: transparent; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--on-deep) 45%, transparent); color: var(--on-deep); padding: .7rem 0; font: inherit; border-radius: 0; }
  .field::placeholder { color: color-mix(in srgb, var(--on-deep) 60%, transparent); }
  .field option { color: #2B2324; background: #fff; }
  .deep-lines { background-image: linear-gradient(115deg, transparent 0 46%, color-mix(in srgb, var(--gold) 55%, transparent) 46% calc(46% + 1px), transparent calc(46% + 1px)), linear-gradient(115deg, transparent 0 52%, color-mix(in srgb, var(--gold) 35%, transparent) 52% calc(52% + 1px), transparent calc(52% + 1px)); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>

function go(e, id) {

  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function Icon({ name, className = 'w-7 h-7' }) {
  const p = { fill: 'none', stroke: 'currentColor', strokeWidth: 1.2, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    flow: <><path d="M3 9c3-4 6 4 9 0s6 4 9 0" {...p} /><path d="M3 15c3-4 6 4 9 0s6 4 9 0" {...p} /></>,
    drop: <path d="M12 3c3.5 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 2.5-6.5 6-11z" {...p} />,
    spark: <><path d="M12 3v5M12 16v5M3 12h5M16 12h5" {...p} /><circle cx="12" cy="12" r="2" {...p} /></>,
    pin: <><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" {...p} /><circle cx="12" cy="10" r="2.4" {...p} /></>,
    clock: <><circle cx="12" cy="12" r="9" {...p} /><path d="M12 7v5l3 2" {...p} /></>,
    phone: <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" {...p} />,

          <p className="text-sm text-mute">{ADDRESS}</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <a className="btn btn-ghost !py-2 !px-4" href={gis} target="_blank" rel="noopener noreferrer">2ГИС</a>
          <a className="btn btn-ghost !py-2 !px-4" href={yandex} target="_blank" rel="noopener noreferrer">Яндекс Карты</a>
        </div>
      </div>
    </div>
  );
}

function Contacts() {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
    try { navigator.clipboard.writeText(PHONE).then(done, () => {}); } catch (e) {}
  };
  const rows = [
    ['pin', 'Адрес', ADDRESS],
    ['clock', 'Время работы', 'Понедельник–суббота, 08:00–20:00'],
  ];
  return (
    <section id="contacts" className="border-t border-line">
      <div className="mx-auto max-w-6xl px-4 sm:px-6 py-16 md:py-24 grid lg:grid-cols-[0.85fr_1.15fr] gap-12 lg:gap-16">
        <div className="min-w-0">
          <p className="eyebrow mb-4">Контакты</p>
          <h2 className="text-4xl sm:text-5xl leading-tight">Запишитесь сегодня, а завтра почувствуйте разницу</h2>
          <ul className="mt-10 space-y-6">
            {rows.map(([ic, l, v]) => (
              <li key={l} className="flex gap-4 min-w-0">
                <span className="text-gold mt-0.5"><Icon name={ic} className="w-6 h-6" /></span>
                <div className="min-w-0"><p className="text-xs tracking-widest uppercase text-mute">{l}</p><p className="text-lg">{v}</p></div>
              </li>
            ))}
            <li className="flex gap-4 min-w-0">
              <span className="text-gold mt-0.5"><Icon name="spark" className="w-6 h-6" /></span>
              <div className="min-w-0"><p className="text-xs tracking-widest uppercase text-mute">Instagram</p>
                <a href={INSTA} target="_blank" rel="noopener noreferrer" className="text-lg underline decoration-gold underline-offset-4 break-all">@bodyline_massage_krymsk</a></div>
            </li>
            <li className="flex gap-4 min-w-0">
              <span className="text-gold mt-0.5"><Icon name="phone" className="w-6 h-6" /></span>
              <div className="min-w-0">
                <p className="text-xs tracking-widest uppercase text-mute">Телефон</p>
                <p className="text-lg tabular-nums">{PHONE}</p>
                <div className="mt-3 flex flex-wrap gap-2">
                  <a href={PHONE_LINK} className="btn btn-rose !py-2.5 !px-5">Позвонить</a>
                  <button type="button" onClick={copy} className="btn btn-ghost !py-2.5 !px-5">{copied ? 'Скопировано' : 'Скопировать номер'}</button>
                </div>
              </div>
            </li>
          </ul>
          <p className="mt-8 text-sm text-mute">Лучше записаться заранее: так мы подберём удобное время без ожидания.</p>
        </div>
        <MapCard />
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="border-t border-line">
      <div className="mx-auto max-w-6xl px-4 sm:px-6 py-10 flex flex-wrap items-center justify-between gap-4 text-sm text-mute">
        <Logo />
        <p>Массаж и обучение · Крымск · Здоровье — основа красоты</p>
      </div>
    </footer>
  );
}

function App() {
  return (
    <>
      <Header />
      <main>
        <Hero />
        <About />
        <Master />
        <Services />
        <Prices />
        <Reviews />
        <Training />
        <Contacts />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
